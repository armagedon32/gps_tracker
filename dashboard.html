<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Tracker Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
    <header>
        <h1>GPS Tracker Dashboard</h1>
        <div id="searchWrap">
            <input id="searchBox" type="text" placeholder="Mag-search ng lugar / address...">
        </div>
        <div id="status">Loading...</div>
    </header>

    <main>
        <div id="map"></div>
        <div id="mapHint"></div>
        <div id="deviceDetail">
            <button class="close" onclick="document.getElementById('deviceDetail').style.display='none'">&times;</button>
            <strong id="ddName">--</strong><br>
            <div class="coords" id="ddCoords">--</div>
            <div class="acc" id="ddAcc"></div>
            <div class="addr" id="ddAddr">Loading address...</div>
        </div>
        <div id="deviceList"></div>

        <div id="sosOverlay">
            <div id="sosCard">
                <div id="sosTitle">🆘 SOS — EMERGENCY ALERT</div>
                <div id="sosInfo">--</div>
                <div id="sosAddr">--</div>
                <div id="sosBtns">
                    <button id="sosLocate">📍 Locate on Map</button>
                    <button id="sosAck">✓ Acknowledge</button>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div id="info">
            <div><strong>Devices:</strong> <span id="deviceCount">0</span></div>
            <div><strong>Last update:</strong> <span id="lastUpdate">--</span></div>
        </div>
        <div id="controls">
            <button id="refreshBtn">Refresh Now</button>
            <button id="centerBtn">Center on All</button>
            <button id="fenceBtn" title="Add a geofence zone">➕ Geofence</button>
            <button id="settingsBtn" title="Alert settings">⚙️ Settings</button>
        </div>
    </footer>

    <div id="toasts"></div>

    <div id="settingsModal">
        <div id="settingsCard">
            <h2>⚙️ Alert Settings</h2>
            <label>Speed limit (km/h) — 0 = off</label>
            <input type="number" id="setSpeed" min="0" max="300" placeholder="0">
            <label>Offline alert after (minutes)</label>
            <input type="number" id="setOffline" min="1" max="1440" placeholder="5">
            <label class="chk"><input type="checkbox" id="setSound"> Sound alerts (kasama ang SOS siren)</label>
            <label class="chk"><input type="checkbox" id="setNotif"> Browser notifications</label>
            <div class="permrow">
                <button id="reqNotifBtn" class="ghost">🔔 Enable notifications</button>
                <span id="notifPermState"></span>
            </div>
            <div class="btnrow">
                <button id="settingsClose" class="ghost">Cancel</button>
                <button id="settingsSave">Save</button>
            </div>
        </div>
    </div>

    <script src="js/dashboard.js"></script>
</body>
</html>
